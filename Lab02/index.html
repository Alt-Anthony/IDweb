<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Formulario para Estudiantes</h1>
    <form action="" method="POST" class="form-container">

        <!-- Datos principales --> 
        <fieldset>
            <legend>Información Personal</legend>

            <div class="form-group">
                <label for="nombres">Nombres y Apellidos:</label>
                <input type="text" id="nombres" name="nombres" required>
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="15" max="100" required>
                <label for="fecha-nacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fecha-nacimiento" name="fecha_nacimiento" required>
            </div>
        </fieldset>

        <!-- Datos del Estudiante-->
        <fieldset>
            <legend>Información de la Cuenta y Académica</legend>

            <div class="form-group">
                <label for="email">Correo Institucional:</label><br>
                <input type="email" id="email" name="email" placeholder="usuario@universidad.edu.pe" required>
            </div>
            <br>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <br>
            <div class="form-group">
                <label for="carrera">Carrera Profesional:</label>
                <select id="carrera" name="carrera" required>
                    <option value="">-- Selecciona una carrera --</option>
                    <option value="sistemas">Ingeniería de Sistemas</option>
                    <option value="industrial">Ingeniería Industrial</option>
                    <option value="civil">Ingeniería Civil</option>
                </select>
            </div>
            <br>
            <div class="form-group">
                <span>Turno:</span>
                <input type="radio" id="turno-manana" name="turno" value="manana" required>
                <label for="turno-manana">Mañana</label>

                <input type="radio" id="turno-tarde" name="turno" value="tarde">
                <label for="turno-tarde">Tarde</label>

                <input type="radio" id="turno-noche" name="turno" value="noche">
                <label for="turno-noche">Noche</label>
            </div>
            <br>
            <div class="form-group">
                <label for="comentarios">Comentarios:</label>
                <textarea id="comentarios" name="comentarios" rows="3"></textarea>
            </div>
            <br>
            <div class="form-group">
                <input type="checkbox" id="terminos" name="terminos" required>
                <label for="terminos">Acepto los términos y condiciones</label>
            </div>
        </fieldset>

        <button type="submit">Registrar Estudiante</button>
    </form>
</body>

</html>
