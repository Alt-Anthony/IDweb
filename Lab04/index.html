<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestor de Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


<body>
    <h2 class="mb-4">Gestor de Tareas</h2>
    <div id="alerta"></div>
    <form id="formulario" class="card p-4 mb-4 bg-light">
        <div class="mb-3">
            <label for="titulo" class="form-label">Nombre de la Tarea:</label>
            <input type="text" id="titulo" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="curso" class="form-label">Curso:</label>
            <input type="text" id="curso" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="fechaEntrega" class="form-label">Fecha de Entrega:</label>
            <input type="date" id="fechaEntrega" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Agregar</button>
    </form>
    <ul id="lista-tareas" class="list-group"></ul>
    <script src="js/app.js"></script>
</body>

</html>
